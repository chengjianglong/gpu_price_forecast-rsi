[project]
name = "gpu-pricing-rsi"
version = "0.1.0"
description = "A self-improving multi-agent GPU price forecaster (Exa data, Tinker RL)"
requires-python = ">=3.10"
dependencies = [
    "exa-py>=2.28",
    "tinker>=0.39",
    "pyyaml>=6",
    "duckdb>=1",
    "pandas>=2",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gpr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
