[project]
name = "hcwm"
version = "0.1.0"
description = "Make an open world model hold together longer while an agent plays in it (PlayWorld, Track 4)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "imageio[ffmpeg]>=2.31",
  "pyyaml>=6",
]

[project.optional-dependencies]
agent = ["anthropic>=0.70"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hcwm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
