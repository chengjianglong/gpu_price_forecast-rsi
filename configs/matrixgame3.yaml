# Matrix-Game 3.0 5B distilled (SkyworkAI/Matrix-Game, Matrix-Game-3/). Single GPU
# (A100/H100 class). Checkpoint: huggingface-cli download Skywork/Matrix-Game-3.0
backend:
  kind: matrixgame3
  args:
    repo_dir: third_party/Matrix-Game/Matrix-Game-3
    ckpt_dir: third_party/Matrix-Game/Matrix-Game-3/Matrix-Game-3.0
    max_steps: 40             # segments: 57 frames first, then 40, at 17 FPS
    cam_value: 0.1            # the repo's per-frame camera value
    yaw_scale: 1.0            # tune with scripts/calibrate_actions.py
    pitch_scale: 1.0
    num_inference_steps: 3
    seed: 42
rollout:
  max_steps: 40
  tokens_per_step: 3
  insight_seconds: 60
  prompt_source: caption
