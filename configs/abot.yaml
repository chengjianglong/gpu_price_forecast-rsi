# ABot-World-0 5B (amap-cvlab/ABot-World). Needs a CUDA GPU with ~19 GB+ and the
# checkpoint at third_party/ABot-World/checkpoints/ABot-World-0-5B-LF.
backend:
  kind: abot
  args:
    repo_dir: third_party/ABot-World
    blocks_per_step: 2        # one block = 12 frames at 12 FPS, so a step is ~2 s
    use_fp8_gemm: true
    # vae_type: taew2_2       # default comes from the repo's configs/default_config.yaml
    # ref_dir: null           # optional folder with head/left/right/front/back reference views
    # key_map:                # override after scripts/calibrate_actions.py
    #   LEFT: [J]
rollout:
  max_steps: 40
  tokens_per_step: 3
  insight_seconds: 60
  prompt_source: caption      # ABot expects a scene description, not the objective
