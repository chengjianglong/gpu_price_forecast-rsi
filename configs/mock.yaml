# CPU stand-in with known camera motion. For tests and plumbing only:
# it never generates anything new, so its PlayWorld score means nothing.
backend:
  kind: mock
  args:
    fps: 12
    step_seconds: 1.0
    turn_deg_per_s: 30
    tilt_deg_per_s: 15
rollout:
  max_steps: 40
  tokens_per_step: 3
  insight_seconds: 60
  prompt_source: caption
